---
groups:
  - name: kernel
    rules:
      - alert: HostKernelVersionDeviations
        # node_uname_info is a constant 1, a kernel change creates a new series,
        # so changes() on it is always 0. Compare the distinct releases instead.
        expr: count(count by (release) (node_uname_info)) > 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Host kernel version deviations
          description: "{{ $value }} different kernel releases are running across the fleet. Reboot the hosts still running an older kernel.\n  VALUE = {{ $value }}"

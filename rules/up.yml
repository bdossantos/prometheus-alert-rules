---
# Targets are selected with the standard `job` label. The Kubernetes ones only
# fire if you scrape those jobs, adjust the job names to your scrape config.
groups:
  - name: up
    rules:
      - alert: APIServerDown
        expr: up{job=~"apiserver|kubernetes-apiservers"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes API Server down (instance {{ $labels.instance }})
          description: "Kubernetes API Server ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Cadvisor down (instance {{ $labels.instance }})
          description: "Cadvisor ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: KubeletDown
        expr: up{job="kubelet"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Kubelet down (instance {{ $labels.instance }})
          description: "Kubelet ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: KubeStateMetricsDown
        expr: up{job="kube-state-metrics"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: KubeStateMetrics down (instance {{ $labels.instance }})
          description: "KubeStateMetrics ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: NodeExporterDown
        expr: up{job=~"node|node[-_]exporter"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: NodeExporter down (instance {{ $labels.instance }})
          description: "NodeExporter ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: TargetDown
        # Everything not covered by a dedicated alert above.
        expr: up{job!~"node|node[-_]exporter|cadvisor|kubelet|kube-state-metrics|apiserver|kubernetes-apiservers"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Target down (instance {{ $labels.instance }})
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: TargetIsFlapping
        expr: changes(up[30m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Target is flapping (instance {{ $labels.instance }})
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) is flapping.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

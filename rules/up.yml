---
groups:
  - name: up
    rules:
      - alert: APIServerDown
        expr: up{app="kubernetes"} == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Kubernetes API Server down (instance {{ $labels.instance }})
          description: "Kubernetes API Server ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: CadvisorDown
        expr: up{app="cadvisor"} == 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: Cadvisor down (instance {{ $labels.instance }})
          description: "Cadvisor ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: KubeletDown
        expr: up{app="kubelet"} == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Kubelet down (instance {{ $labels.instance }})
          description: "Kubelet ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
          opsrecipe: https://github.com/giantswarm/ops-recipes/blob/master/020-kubelet-is-down.md

      - alert: KubeStateMetricsDown
        expr: up{app="kube-state-metrics"} == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: KubeStateMetrics down (instance {{ $labels.instance }})
          description: "KubeStateMetrics ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: NodeExporterDown
        expr: up{app="node-exporter"} == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: NodeExporter down (instance {{ $labels.instance }})
          description: "NodeExporter ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: TargetDown
        expr: up{cluster_type="host", app!~"cadvisor|etcd|kubelet|kubernetes|master|node-exporter|worker"} == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Target down (instance {{ $labels.instance }})
          description: "Target {{ $labels.namespace }}/{{ $labels.app }} ({{ $labels.instance }}) is down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: TargetIsFlapping
        expr: changes(up[30m]) > 5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Target is flapping (instance {{ $labels.instance }})
          description: "Target {{ $labels.app }} ({{ $labels.instance }}) is flapping.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

---
groups:
  - name: reboot
    rules:
      - alert: NodeRebooted
        # node_boot_time_seconds is a gauge: rate() would treat a clock step as a
        # counter reset. Use the uptime, computed from the node's own clock.
        expr: ((node_time_seconds - node_boot_time_seconds) < 300) * on(instance) group_left (nodename) node_uname_info{nodename=~".+"}
        for: 0m
        labels:
          severity: page
        annotations:
          summary: Machine rebooted (instance {{ $labels.instance }})
          description: "Machine {{ $labels.instance }} rebooted less than 5 minutes ago.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: NodeRebootsTooOften
        expr: changes(node_boot_time_seconds{job="node"}[1d]) > 1
        for: 0m
        labels:
          severity: page
        annotations:
          summary: Node reboots too often (instance {{ $labels.instance }})
          description: "Machine {{ $labels.instance }} reboots too often ({{ $value }} is more than 1 times per 1d)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      # shellcheck is preinstalled on ubuntu-latest runners. A previous step that
      # downloaded and cached a copy under ./bin was never used: `export PATH` does
      # not persist across steps and the Makefile does not look in ./bin.
      - name: Run tests, lint and shellcheck
        run: |
          timeout 10m make test lint shellcheck

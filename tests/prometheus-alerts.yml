rule_files:
  - ../rules/prometheus-alerts.yml

evaluation_interval: 1m

tests:
  - name: the dead man's switch always fires and is never routed as a page
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="a:9100"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 0m
        alertname: PrometheusAlertmanagerE2eDeadManSwitch
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Prometheus AlertManager E2E dead man switch"
              description: "Prometheus DeadManSwitch is an always-firing alert. It's used as an end-to-end test of Prometheus through the Alertmanager.\n  VALUE = 1\n  LABELS = map[]"

  - name: PrometheusTargetMissing tolerates a single failed scrape but pages a target that stays down
    interval: 1m
    input_series:
      # a: one failed scrape, then recovers
      - series: 'up{job="node", instance="a:9100"}'
        values: '1 0 1x18'
      # b: down for good while the rest of the job is up
      - series: 'up{job="node", instance="b:9100"}'
        values: '0x20'
      - series: 'up{job="node", instance="c:9100"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: PrometheusTargetMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusTargetMissing
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: "b:9100"
            exp_annotations:
              summary: "Prometheus target missing (instance b:9100)"
              description: "A Prometheus target has disappeared. An exporter might be crashed.\n  VALUE = 0\n  LABELS = map[__name__:up instance:b:9100 job:node]"

  - name: PrometheusTargetMissingWithWarmupTime ignores a host that booted less than 10 minutes ago
    interval: 1m
    input_series:
      # a: exporter down, host up for 1h, warmup is over
      - series: 'up{job="node", instance="a:9100"}'
        values: '0x30'
      - series: 'node_time_seconds{instance="a:9100"}'
        values: '1700003600x30'
      - series: 'node_boot_time_seconds{instance="a:9100"}'
        values: '1700000000x30'
      # b: exporter down, host up for 100s only, still warming up
      - series: 'up{job="node", instance="b:9100"}'
        values: '0x30'
      - series: 'node_time_seconds{instance="b:9100"}'
        values: '1700000100x30'
      - series: 'node_boot_time_seconds{instance="b:9100"}'
        values: '1700000000x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusTargetMissingWithWarmupTime
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: "a:9100"
            exp_annotations:
              summary: "Prometheus target missing with warmup time (instance a:9100)"
              description: "Allow a job time to start up (10 minutes) before alerting that it's down.\n  VALUE = 0\n  LABELS = map[instance:a:9100 job:node]"

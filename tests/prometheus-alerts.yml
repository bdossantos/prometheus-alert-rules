rule_files:
  - ../rules/prometheus-alerts.yml

evaluation_interval: 1m

tests:
  - name: the dead man's switch always fires and is never routed as critical
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="a:9100"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 0m
        alertname: PrometheusAlertmanagerE2eDeadManSwitch
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Prometheus AlertManager E2E dead man switch"
              description: "Prometheus DeadManSwitch is an always-firing alert. It's used as an end-to-end test of Prometheus through the Alertmanager.\n  VALUE = 1\n  LABELS = map[]"

  - name: ExporterDown tolerates a single failed scrape but alerts on a target that stays down
    interval: 1m
    input_series:
      # a: one failed scrape, then recovers
      - series: 'up{job="node", instance="a:9100"}'
        values: '1 0 1x18'
      # b: down for good while the rest of the job is up
      - series: 'up{job="node", instance="b:9100"}'
        values: '0x20'
      - series: 'up{job="node", instance="c:9100"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: ExporterDown
        exp_alerts: []
      - eval_time: 10m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: "b:9100"
            exp_annotations:
              summary: "Exporter down (instance b:9100)"
              description: "Prometheus exporter down\n  VALUE = 0\n  LABELS = map[__name__:up instance:b:9100 job:node]"

  - name: PrometheusAllTargetsMissing fires when a whole job is down for 2 minutes
    interval: 1m
    input_series:
      - series: 'up{job="vault", instance="v1:8200"}'
        values: '0x10'
      - series: 'up{job="vault", instance="v2:8200"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: PrometheusAllTargetsMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: PrometheusAllTargetsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: vault
            exp_annotations:
              summary: "Prometheus all targets missing (job vault)"
              description: "A Prometheus job does not have living target anymore.\n  VALUE = 0\n  LABELS = map[job:vault]"

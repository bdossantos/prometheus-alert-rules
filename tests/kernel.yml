rule_files:
  - ../rules/kernel.yml

evaluation_interval: 1m

tests:
  - name: same kernel release everywhere does not alert
    interval: 1m
    input_series:
      - series: 'node_uname_info{instance="a:9100", release="6.1.0-18-amd64", nodename="a"}'
        values: '1x180'
      - series: 'node_uname_info{instance="b:9100", release="6.1.0-18-amd64", nodename="b"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: HostKernelVersionDeviations
        exp_alerts: []

  - name: a different kernel release on one host alerts after 1h (ABI bump included)
    interval: 1m
    input_series:
      - series: 'node_uname_info{instance="a:9100", release="6.1.0-18-amd64", nodename="a"}'
        values: '1x180'
      - series: 'node_uname_info{instance="b:9100", release="6.1.0-21-amd64", nodename="b"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: HostKernelVersionDeviations
        exp_alerts: []
      - eval_time: 90m
        alertname: HostKernelVersionDeviations
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Host kernel version deviations
              description: "2 different kernel releases are running across the fleet. Reboot the hosts still running an older kernel.\n  VALUE = 2"
